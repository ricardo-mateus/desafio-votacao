spring:
    application
        name: desafio.votacao

    datasource:
        url: jdbc:h2:file:./data/votacao;DB_CLOSE_ON_EXIT=FALSE;AUTO_SERVER=TRUE
        username: sa
        password:
        driverClassName: org.h2.Driver

    jpa:
        hibernate:
            ddl-auto: update
        show-sql: true
        properties:
            hibernate.format_sql: true

server:
    port: 8080

logging:
    level:
        org.hibernate.SQL: DEBUG
